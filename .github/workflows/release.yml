name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          uv venv
          uv pip install build

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Create Release Bundle
        run: |
          mkdir -p release_bundle
          cp dist/* release_bundle/
          cp notebooks/ZeRO_optimiser_sim.ipynb release_bundle/
          tar -czf release_bundle/results.tar.gz results/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release_bundle/* \
            --title "Release ${{ github.ref_name }}" \
            --notes "Release bundle containing distribution packages, evaluation notebook, and reproducible simulation results."
