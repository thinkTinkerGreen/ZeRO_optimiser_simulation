name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          uv venv
          uv pip install build

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Create Release Bundle
        run: |
          mkdir -p release_bundle
          cp dist/* release_bundle/
          cp notebooks/ZeRO_optimiser_sim.ipynb release_bundle/
          tar -czf release_bundle/results.tar.gz results/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release_bundle/* \
            --title "Release ${{ github.ref_name }}" \
            --notes "Release bundle containing distribution packages, evaluation notebook, and reproducible simulation results."
