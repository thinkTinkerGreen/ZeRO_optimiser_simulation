name: Dist Parity

on:
  push:
    branches: [main]
    paths:
      - "src/zerosim/comm/**"
      - "src/zerosim/stages/**"
      - "tests/dist/**"
      - ".github/workflows/dist-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/zerosim/comm/**"
      - "src/zerosim/stages/**"
      - "tests/dist/**"
      - ".github/workflows/dist-parity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dist-parity:
    name: Distributed Parity (E6 Gloo N=4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,torch]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match

      - name: Run E6 distributed test via pytest
        run: |
          PYTHONHASHSEED=0 uv run pytest tests/dist -v
