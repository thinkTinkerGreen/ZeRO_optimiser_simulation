name: Dist Parity

on:
  push:
    branches: [main]
    paths:
      - "src/zerosim/comm/**"
      - "src/zerosim/stages/**"
      - "tests/dist/**"
      - ".github/workflows/dist-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/zerosim/comm/**"
      - "src/zerosim/stages/**"
      - "tests/dist/**"
      - ".github/workflows/dist-parity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dist-parity:
    name: Distributed Parity (E6 Gloo N=4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,torch]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match

      - name: Run E6 distributed test via pytest
        run: |
          PYTHONHASHSEED=0 uv run pytest tests/dist -v
